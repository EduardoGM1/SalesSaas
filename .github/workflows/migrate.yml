name: Migrate

on:
  workflow_dispatch:
    inputs:
      prefix:
        description: "Prefijo de migración (p. ej. 0092) o ruta supabase/migrations/...."
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Apply migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Falta secret DATABASE_URL. Configúralo en GitHub Actions."
            exit 1
          fi
          node scripts/apply-migration.mjs "${{ inputs.prefix }}"
