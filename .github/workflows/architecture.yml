name: Arquitectura

on:
  push:
    branches: [main, test/arquitectura-red-seguridad, 'arquitectura/**']
  pull_request:
    branches: [main]

# Sin paths-ignore: check-doc-proyecto debe correr también en commits de solo docs.
concurrency:
  group: arquitectura-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  red-seguridad:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Red de seguridad (checks arquitectura)
        run: npm run verificar:arquitectura:checks
        env:
          CI: true
      - name: API test:security
        run: npm run test:security -w @salesapp/api
        env:
          CI: true
      - name: Web Vite build (CI placeholders)
        run: npm run build:web:ci
        env:
          CI: true
      - name: Gitleaks (binario, solo diff)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
            fi
          fi
          echo "Gitleaks diff range: ${BASE}..${HEAD}"
          gitleaks git --log-opts="${BASE}..${HEAD}" --redact --exit-code=1
