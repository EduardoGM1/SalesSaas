name: Arquitectura

on:
  push:
    branches: [main, test/arquitectura-red-seguridad, 'arquitectura/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  red-seguridad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Red de seguridad (checks arquitectura)
        run: npm run verificar:arquitectura:checks
        env:
          CI: true
      - name: API test:security
        run: npm run test:security -w @salesapp/api
        env:
          CI: true
      - name: Web Vite build (CI placeholders)
        run: npm run build:web:ci
        env:
          CI: true
