name: Arquitectura

on:
  push:
    branches: [main, test/arquitectura-red-seguridad]
  pull_request:
    branches: [main]

jobs:
  red-seguridad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Red de seguridad (checks 1–5)
        run: npm run verificar:arquitectura:checks
        env:
          CI: true
