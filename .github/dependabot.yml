# Dependabot — npm (monorepo workspaces) + GitHub Actions
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Majors diferidos a proyecto aparte (backlog ops privado).
    ignore:
      - dependency-name: helmet
        update-types: ["version-update:semver-major"]
      - dependency-name: dotenv
        update-types: ["version-update:semver-major"]
      - dependency-name: express
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
