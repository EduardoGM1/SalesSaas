# Salètse — acceso por IP (sin dominio). No modifica cuidateapp.com.mx.
server {
    listen 80;
    listen [::]:80;
    server_name 187.77.14.148;

    root /var/www/Saletse/apps/web/dist;
    index index.html;
    # Alineado con Express JSON_BODY_LIMIT (8mb). Uploads grandes van a Storage.
    client_max_body_size 8M;
    client_header_buffer_size 32k;
    large_client_header_buffers 8 64k;

    include /etc/nginx/snippets/saletse-security-headers.conf;

    # Kong self-hosted, mismo origen que la SPA (desviación necesaria: el
    # navegador no puede usar 127.0.0.1:8001). Más específico que location /auth.
    location /auth/v1/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
    location /rest/v1/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
    location /realtime/v1/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location /storage/v1/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location /health {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
    }

    # OAuth/email confirm: SPA (igual que vercel.json rewrite /auth/callback → index.html)
    location = /auth/callback {
        include /etc/nginx/snippets/saletse-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        try_files /index.html =404;
    }

    location /auth {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OneSignal / PWA móvil
    location /onesignal/ {
        include /etc/nginx/snippets/saletse-security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        default_type application/javascript;
        try_files $uri =404;
    }

    location = /OneSignalSDKWorker.js {
        include /etc/nginx/snippets/saletse-security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        default_type application/javascript;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/snippets/saletse-security-headers.conf;
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri =404;
    }

    location /assets/ {
        include /etc/nginx/snippets/saletse-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/saletse-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        try_files $uri =404;
    }

    location = /sw.js {
        include /etc/nginx/snippets/saletse-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        try_files $uri =404;
    }

    location = /build-id.txt {
        include /etc/nginx/snippets/saletse-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
