# Headers de seguridad — Salètse (HTTP, puerto 80).
#
# HSTS (Strict-Transport-Security): NO activar. El sitio sigue en HTTP puro
# (P4 pendiente: HTTPS propio). Publicar HSTS ahora, o a medias con un
# certificado incompleto, puede dejar el navegador insistiendo en HTTPS
# y romper el acceso por IP.
#
# include este archivo en el server {} y en CADA location que ya tenga
# add_header (si no, Nginx descarta los headers del padre).

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://cdn.onesignal.com https://api.onesignal.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://onesignal.com https://*.onesignal.com; connect-src 'self' ws://187.77.14.148 wss://187.77.14.148 https://onesignal.com https://*.onesignal.com https://cdn.onesignal.com https://api.onesignal.com; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'; frame-src 'self' https://onesignal.com https://*.onesignal.com; media-src 'self' blob:;" always;
